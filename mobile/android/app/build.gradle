apply plugin: 'com.android.application'

android {
    namespace = "kr.co.manee.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "kr.co.manee.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('maneeRelease148') ? 49 : project.hasProperty('maneeRelease147') ? 48 : project.hasProperty('maneeRelease146') ? 47 : project.hasProperty('maneeRelease145') ? 46 : project.hasProperty('maneeQa144') ? 45 : project.hasProperty('maneeQa143') ? 44 : (project.hasProperty('maneeQa142') ? 43 : 23)
        versionName project.hasProperty('maneeRelease148') ? '1.48' : project.hasProperty('maneeRelease147') ? '1.47' : project.hasProperty('maneeRelease146') ? '1.46' : project.hasProperty('maneeRelease145') ? '1.45' : project.hasProperty('maneeQa144') ? '1.44' : project.hasProperty('maneeQa143') ? '1.43' : (project.hasProperty('maneeQa142') ? '1.42-sector1-4-test' : '1.22')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        upload {
            def uploadPath = System.getenv('MANEE_ANDROID_UPLOAD_KEYSTORE')
            if (uploadPath) storeFile file(uploadPath)
            storePassword System.getenv('MANEE_ANDROID_UPLOAD_STORE_PASSWORD')
            keyAlias System.getenv('MANEE_ANDROID_UPLOAD_KEY_ALIAS')
            keyPassword System.getenv('MANEE_ANDROID_UPLOAD_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.staging'
            versionNameSuffix '-android-test'
            if (project.hasProperty('maneeQa142') || project.hasProperty('maneeQa143') || project.hasProperty('maneeQa144')) {
                versionNameSuffix ''
            }
        }
        release {
            signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if ((project.hasProperty('maneeRelease145') || project.hasProperty('maneeRelease146') || project.hasProperty('maneeRelease147')) && graph.allTasks.any { it.path == ':app:preDebugBuild' }) {
        throw new GradleException('Store updates must use the production release variant.');
    }
    if ((project.hasProperty('maneeQa142') || project.hasProperty('maneeQa143') || project.hasProperty('maneeQa144')) && graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        throw new GradleException('QA versions are debug-only.')
    }
}

// Both variants verify their own backend before assets are packaged.
// A release without a dedicated upload key must never fall back to debug signing.
['Debug': 'staging', 'Release': 'production'].each { variantName, environment ->
    def guard = tasks.register("verify${variantName}Assets", Exec) {
        workingDir rootProject.projectDir.parentFile
        commandLine 'node', 'scripts/verify-android-build.mjs', environment
    }
    tasks.matching { it.name == "pre${variantName}Build" }.configureEach { dependsOn guard }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'


// A config-free test APK remains usable without initializing FCM.
if (file("google-services.json").exists() || file("src/release/google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

