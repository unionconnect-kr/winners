<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>계정 삭제 요청 · 매니</title>
  <style>
    body{margin:0;background:#f3f5f2;color:#18352a;font:16px/1.65 system-ui,-apple-system,sans-serif}
    main{box-sizing:border-box;max-width:600px;margin:5vh auto;padding:32px;background:#fff;border-radius:20px}
    h1{font-size:1.6rem;line-height:1.3;margin:0 0 20px}
    label{display:block;margin:20px 0 6px;font-weight:700}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #929e98;border-radius:8px;font:inherit}
    button{margin:24px 0 0;padding:14px 24px;border:0;border-radius:8px;background:#145847;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #result{min-height:1.6em}small{display:block;color:#53635a}
    @media(max-width:640px){main{margin:0;min-height:100vh;border-radius:0;padding:24px}}
  </style>
</head>
<body>
<main>
  <h1>매니 계정 삭제 요청</h1>
  <p>앱을 삭제했더라도 여기에서 계정과 연결된 개인정보의 삭제를 요청할 수 있습니다. 요청 접수 후 계정 소유 여부와 매장 자료의 처리 범위를 확인해 연락드리겠습니다.</p>
  <p>Google Play 구독은 Play 스토어의 <strong>결제 및 정기 결제 → 정기 결제</strong>에서 별도로 취소할 수 있습니다. 요청만으로 구독이 취소되지는 않습니다.</p>
  <form id="request-form">
    <label for="username">매니 로그인 아이디</label>
    <input id="username" name="username" required minlength="4" maxlength="30" autocomplete="username">
    <label for="contact">연락 가능한 이메일 또는 전화번호</label>
    <input id="contact" name="contact" required minlength="5" maxlength="120" autocomplete="email">
    <small>확인과 처리 안내에만 사용합니다. 비밀번호나 주민등록번호는 입력하지 마세요.</small>
    <button type="submit">삭제 요청하기</button>
    <p id="result" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
  const form=document.getElementById('request-form');
  const result=document.getElementById('result');
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    const button=form.querySelector('button');button.disabled=true;result.textContent='요청을 보내고 있어요…';
    try{
      const response=await fetch('/.netlify/functions/account-deletion-request',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:form.elements.namedItem('username').value,contact:form.elements.namedItem('contact').value})
      });
      const body=await response.json();
      if(!response.ok)throw Error(body.message||'요청을 접수하지 못했어요. 잠시 후 다시 시도해 주세요.');
      result.textContent=body.message;form.reset();
    }catch(error){result.textContent=error.message||'연결을 확인한 뒤 다시 시도해 주세요.';}
    finally{button.disabled=false;}
  });
</script>
</body>
</html>
