# Repository: https://github.com/unionconnect-kr/winners
[build]
  command = "node scripts/build-environment.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/app-config.js"
  [headers.values]
    Cache-Control = "no-store"

[functions."notify-reservations-cron"]
  schedule = "0 15 * * *"

[functions."notify-reservation-reminders-cron"]
  schedule = "*/10 * * * *"

[functions."notify-monthly-costs-cron"]
schedule = "0 1 * * *"

# Netlify disables HTTP routes for these scheduled-only workers.
[functions."ios-push-scheduled"]
  schedule = "* * * * *"

[functions."ios-billing-scheduled"]
  schedule = "* * * * *"
