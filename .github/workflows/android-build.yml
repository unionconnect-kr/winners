name: Android staging APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'owner-ui.css'
      - 'report-assets/**'
      - 'config/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run apk:staging
      - name: Verify packaged app
        run: node scripts/verify-android-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: manee-android-staging-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
