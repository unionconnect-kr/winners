name: Native secure auth device checks
on:
  pull_request:
    paths:
      - 'mobile/src/secure-auth*'
      - 'mobile/scripts/secure-auth*'
      - 'mobile/android/app/src/main/java/kr/co/manee/app/ManeeSecureAuth*'
      - 'mobile/android/app/src/androidTest/**'
      - '.github/workflows/native-secure-auth.yml'
permissions:
  contents: read
concurrency:
  group: native-secure-auth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: mobile
      - run: npm run build:android:staging && npm run sync:android
        working-directory: mobile
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd mobile/android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=kr.co.manee.app.SecureAuthStoreTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secure-auth-android-instrumentation
          path: mobile/android/app/build/reports/androidTests/connected/
          retention-days: 14
