name: Select MANEE 156.20.2 for iOS review draft
on:
  push:
    branches: [codex/ios-trial-catalog-check-20261112]
    paths: ['.github/workflows/ios-review-build-selection-20261112.yml']
permissions:
  contents: read
concurrency:
  group: manee-ios-156-review-build
  cancel-in-progress: false
jobs:
  select-build:
    if: github.repository == 'unionconnect-kr/winners' && github.ref == 'refs/heads/codex/ios-trial-catalog-check-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the tested build and verify the saved draft
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { makeToken } from './mobile/scripts/check-apple-connection.mjs';

          const origin = 'https://api.appstoreconnect.apple.com';
          const appId = '6820833544';
          const versionId = '87063b6a-6afc-4384-a766-c493dbbcca1f';
          const appVersion = '1.56';
          const previousBuild = '156.19.1';
          const targetBuild = '156.20.2';
          const draftState = 'PREPARE_FOR_SUBMISSION';
          const versionPath = '/v1/appStoreVersions/' + versionId;
          const validId = value => typeof value === 'string' && /^[a-zA-Z0-9-]{1,80}$/.test(value);

          async function request(path, params = {}, options = {}) {
            const url = new URL(path, origin);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
            const headers = {
              Authorization: 'Bearer ' + makeToken(process.env),
              Accept: 'application/json',
              ...(options.body ? { 'Content-Type': 'application/json' } : {}),
            };
            const response = await fetch(url, {
              redirect: 'error',
              signal: AbortSignal.timeout(20000),
              headers,
              ...options,
            });
            if (!response.ok) throw Error('APPLE_DRAFT_HTTP_' + response.status);
            return response.status === 204 ? {} : await response.json();
          }

          function isDraft(version) {
            const attrs = version?.attributes;
            return version?.id === versionId && attrs?.versionString === appVersion &&
              attrs.platform === 'IOS' && attrs.appStoreState === draftState;
          }

          async function selectBuild() {
            const [app, versions] = await Promise.all([
              request('/v1/apps/' + appId, { 'fields[apps]': 'bundleId' }),
              request('/v1/apps/' + appId + '/appStoreVersions', { 'filter[platform]': 'IOS', limit: '10' }),
            ]);
            if (app.data?.id !== appId || app.data.attributes?.bundleId !== 'kr.co.manee.app') {
              throw Error('APPLE_DRAFT_APP_MISMATCH');
            }
            if (!versions.data?.some(isDraft)) throw Error('APPLE_DRAFT_VERSION_NOT_EDITABLE');

            const builds = await request('/v1/builds', { 'filter[app]': appId, 'filter[version]': targetBuild, limit: '2' });
            const [build] = builds.data || [];
            const attrs = build?.attributes;
            if (builds.data?.length !== 1 || builds.links?.next || build.type !== 'builds' ||
                !validId(build.id) || attrs?.version !== targetBuild || attrs.processingState !== 'VALID' ||
                attrs.expired || attrs.buildAudienceType === 'INTERNAL_ONLY') {
              throw Error('APPLE_DRAFT_BUILD_NOT_ELIGIBLE');
            }
            const preRelease = await request('/v1/builds/' + build.id + '/preReleaseVersion');
            if (preRelease.data?.attributes?.version !== appVersion || preRelease.data.attributes.platform !== 'IOS') {
              throw Error('APPLE_DRAFT_BUILD_VERSION_MISMATCH');
            }

            const [draft, current] = await Promise.all([request(versionPath), request(versionPath + '/build')]);
            if (!isDraft(draft.data)) throw Error('APPLE_DRAFT_VERSION_NOT_EDITABLE');
            const changed = current.data?.id !== build.id;
            if (changed) {
              if (current.data?.attributes?.version !== previousBuild) throw Error('APPLE_DRAFT_BUILD_CHANGED');
              await request(versionPath + '/relationships/build', {}, {
                method: 'PATCH',
                body: JSON.stringify({ data: { type: 'builds', id: build.id } }),
              });
            }

            const [saved, after] = await Promise.all([request(versionPath + '/build'), request(versionPath)]);
            if (saved.data?.id !== build.id || saved.data.attributes?.version !== targetBuild || !isDraft(after.data)) {
              throw Error('APPLE_DRAFT_ASSOCIATION_NOT_VERIFIED');
            }
            return { appId, version: appVersion, build: targetBuild, state: draftState, changed };
          }

          try {
            console.log(JSON.stringify(await selectBuild()));
          } catch (error) {
            console.error(/^APPLE_DRAFT_[A-Z0-9_]+$/.test(error.message) ? error.message : 'APPLE_DRAFT_REQUEST_FAILED');
            process.exitCode = 1;
          }
          NODE
