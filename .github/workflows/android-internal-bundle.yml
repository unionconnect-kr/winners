name: Android Play internal setup bundle
on:
  workflow_dispatch:
  push:
    branches: ['codex/android-push-location-20261013']
    paths: ['.github/workflows/android-internal-bundle.yml']
permissions:
  contents: read
concurrency:
  group: android-play-internal
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: android-play-internal
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - name: Build and verify signed internal-setup bundle
        env:
          MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          MANEE_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.MANEE_ANDROID_UPLOAD_STORE_PASSWORD }}
          MANEE_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.MANEE_ANDROID_UPLOAD_KEY_ALIAS }}
          MANEE_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.MANEE_ANDROID_UPLOAD_KEY_PASSWORD }}
          MANEE_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.MANEE_ANDROID_UPLOAD_CERT_SHA256 }}
          MANEE_ANDROID_FIREBASE_PRODUCTION_JSON: ${{ secrets.MANEE_ANDROID_FIREBASE_PRODUCTION_JSON }}
        run: |
          set -euo pipefail
          umask 077
          export MANEE_ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/manee-upload.jks"
          trap 'rm -f "$MANEE_ANDROID_UPLOAD_KEYSTORE" android/app/src/release/google-services.json' EXIT
          node --input-type=module - <<'JS'
          import {writeFileSync, mkdirSync} from 'node:fs';
          import assert from 'node:assert/strict';
          for (const name of ['MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64','MANEE_ANDROID_UPLOAD_STORE_PASSWORD',
            'MANEE_ANDROID_UPLOAD_KEY_ALIAS','MANEE_ANDROID_UPLOAD_KEY_PASSWORD',
            'MANEE_ANDROID_UPLOAD_CERT_SHA256','MANEE_ANDROID_FIREBASE_PRODUCTION_JSON']) {
            assert.ok(process.env[name], 'Missing release configuration: '+name);
          }
          mkdirSync('android/app/src/release',{recursive:true});
          writeFileSync(process.env.MANEE_ANDROID_UPLOAD_KEYSTORE,Buffer.from(process.env.MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64,'base64'),{mode:0o600});
          writeFileSync('android/app/src/release/google-services.json',process.env.MANEE_ANDROID_FIREBASE_PRODUCTION_JSON,{mode:0o600});
          JS
          npm run aab:internal
          node scripts/verify-android-aab.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: manee-play-internal-setup-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
