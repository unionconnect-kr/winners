name: Disposable backup and restore checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/backup-run.mjs'
      - 'security/backup-run.test.mjs'
      - '.github/workflows/backup-rehearsal.yml'

permissions:
  contents: read

concurrency:
  group: backup-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGBIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local PostgreSQL 17 tools
        run: |
          set -euo pipefail
          if ! test -x "$PGBIN/pg_ctl"; then
            sudo apt-get update -qq
            sudo apt-get install -y curl ca-certificates
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/manee-pgdg.list
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-17
          fi
          for tool in postgres initdb pg_ctl psql pg_dump pg_restore; do
            test -x "$PGBIN/$tool"
          done
          "$PGBIN/postgres" --version
      - name: Rehearse using synthetic data only
        run: |
          set -euo pipefail
          # The tests create their own loopback servers and synthetic records.
          # No repository secret, live database URL or real backup is supplied.
          node --test --test-reporter=tap security/backup-run.test.mjs | tee /tmp/manee-backup-rehearsal.txt
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const log = readFileSync('/tmp/manee-backup-rehearsal.txt', 'utf8');
          assert.match(log, /^# tests 11$/m);
          assert.match(log, /^# pass 11$/m);
          assert.match(log, /^# fail 0$/m);
          assert.match(log, /^# skipped 0$/m);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-backup-rehearsal-results
          path: /tmp/manee-backup-rehearsal.txt
          retention-days: 14
