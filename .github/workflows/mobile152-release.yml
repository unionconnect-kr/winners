name: MANEE 1.52 signed store update files
on:
  push:
    branches: [codex/final-email-billing-152-20261106]
    paths: ['mobile/**', 'supabase/**', 'security/**', 'tests/**', 'scripts/**', 'config/**', 'index.html', '*.js', '*.css', 'package*.json', '.github/workflows/mobile152-release.yml']
permissions:
  contents: read
concurrency:
  group: mobile152-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    name: App regression and concurrent database checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: manee_code_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MANEE_TEST_DATABASE_URL: postgresql://postgres:local_ci_only@127.0.0.1:5432/manee_code_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install workbook test dependencies
        run: npm --prefix mobile ci
      - name: Ensure database and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client poppler-utils
      - name: Check concurrent requests on the disposable database
        run: |
          set -euo pipefail
          test -n "$MANEE_TEST_DATABASE_URL"
          # Cluster roles are shared, so bootstrap suites sequentially.
          # Each suite still sends competing requests concurrently.
          node --test --test-reporter=tap security/store-code-concurrency.test.mjs | tee /tmp/android-concurrency.txt
          node --test --test-reporter=tap security/new-staff-self-profile-concurrency.test.mjs | tee -a /tmp/android-concurrency.txt
          node --test --test-reporter=tap security/attendance-concurrency.test.mjs | tee -a /tmp/android-concurrency.txt
          node --test --test-reporter=tap security/new-store-billing-concurrency.test.mjs | tee -a /tmp/android-concurrency.txt
          node --test --test-reporter=tap tests/phone-one-account-concurrency.test.mjs | tee -a /tmp/android-concurrency.txt
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const log = readFileSync('/tmp/android-concurrency.txt', 'utf8');
          // A skipped suite must never allow an APK through this gate.
          assert.equal([...log.matchAll(/^# tests 1$/gm)].length, 5);
          assert.equal([...log.matchAll(/^# pass 1$/gm)].length, 5);
          assert.equal([...log.matchAll(/^# skipped 0$/gm)].length, 5);
          JS
      - name: Check app and security regressions
        run: |
          set -euo pipefail
          # Real concurrency ran above. Backup rehearsals have separate requirements.
          env -u MANEE_TEST_DATABASE_URL node --test --test-concurrency=2 --test-reporter=tap security/*.test.mjs tests/*.test.mjs | tee /tmp/android-regression.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manee152-full-regression-results
          path: /tmp/android-*.txt
          retention-days: 14
  verify:
    needs: [regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mobile
      - run: node --test --test-concurrency=2 --test-reporter=tap mobile/scripts/*.test.mjs
      - run: node mobile/scripts/build-release152.mjs ios production
      - run: node mobile/scripts/verify-store-assets.mjs --release152
  android:
    needs: [verify]
    runs-on: ubuntu-24.04
    environment: android-play-internal
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build upload-signed AAB and APK with production services
        env:
          MANEE_ANDROID_RELEASE_PURPOSE: store-update
          MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          MANEE_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.MANEE_ANDROID_UPLOAD_STORE_PASSWORD }}
          MANEE_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.MANEE_ANDROID_UPLOAD_KEY_ALIAS }}
          MANEE_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.MANEE_ANDROID_UPLOAD_KEY_PASSWORD }}
          MANEE_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.MANEE_ANDROID_UPLOAD_CERT_SHA256 }}
          MANEE_ANDROID_FIREBASE_PRODUCTION_JSON: ${{ secrets.MANEE_ANDROID_FIREBASE_PRODUCTION_JSON }}
        run: |
          set -euo pipefail
          umask 077
          export MANEE_ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/manee-upload.jks"
          trap 'rm -f "$MANEE_ANDROID_UPLOAD_KEYSTORE" android/app/src/release/google-services.json' EXIT
          node --input-type=module - <<'JS'
          import {writeFileSync,mkdirSync} from 'node:fs';
          import assert from 'node:assert/strict';
          for(const n of ['MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64','MANEE_ANDROID_UPLOAD_STORE_PASSWORD','MANEE_ANDROID_UPLOAD_KEY_ALIAS','MANEE_ANDROID_UPLOAD_KEY_PASSWORD','MANEE_ANDROID_UPLOAD_CERT_SHA256','MANEE_ANDROID_FIREBASE_PRODUCTION_JSON'])assert.ok(process.env[n],'Missing release configuration: '+n);
          mkdirSync('android/app/src/release',{recursive:true});
          writeFileSync(process.env.MANEE_ANDROID_UPLOAD_KEYSTORE,Buffer.from(process.env.MANEE_ANDROID_UPLOAD_KEYSTORE_BASE64,'base64'),{mode:0o600});
          writeFileSync('android/app/src/release/google-services.json',process.env.MANEE_ANDROID_FIREBASE_PRODUCTION_JSON,{mode:0o600});
          JS
          node scripts/build-release152.mjs android production
          node scripts/verify-store-assets.mjs --release152
          npm run sync:android
          cd android
          ./gradlew :app:bundleRelease :app:assembleRelease -PmaneeRelease152
          cd ..
          node scripts/verify-android-aab.mjs --store-update
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/manee152-apk-manifest.txt"
          python3 - <<'PY'
          import os,pathlib
          report=(pathlib.Path(os.environ['RUNNER_TEMP'])/'manee152-apk-manifest.txt').read_text()
          assert "package: name='kr.co.manee.app' versionCode='53' versionName='1.52'" in report
          assert "targetSdkVersion:'36'" in report
          assert "uses-permission: name='android.permission.POST_NOTIFICATIONS'" in report
          assert "uses-permission: name='com.android.vending.BILLING'" in report
          assert 'application-debuggable' not in report
          assert "application-label:'매니'" in report
          print('Release APK package, version, permissions and non-debuggable manifest verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manee-android-1.52-store-update
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
  archive:
    needs: [verify]
    # The standard arm64 pool is currently reporting hosted-runner capacity errors.
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun altool --help > "$RUNNER_TEMP/manee-altool-help.txt" 2>&1
          grep -q -- '--validate-app' "$RUNNER_TEMP/manee-altool-help.txt"
          grep -q -- '--upload-app' "$RUNNER_TEMP/manee-altool-help.txt"
          grep -q -- '--apiKey' "$RUNNER_TEMP/manee-altool-help.txt"
          grep -q -- '--apiIssuer' "$RUNNER_TEMP/manee-altool-help.txt"
      - name: Check signing secrets and decode files
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, base64, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'manee-signing'
          root.mkdir(mode=0o700, exist_ok=True)
          for name in ('IOS_DISTRIBUTION_P12_BASE64', 'IOS_DISTRIBUTION_P12_PASSWORD', 'IOS_PROVISION_PROFILE_BASE64'):
              if not os.environ.get(name):
                  raise SystemExit('Missing secret: ' + name)
          for name, filename in [('IOS_DISTRIBUTION_P12_BASE64', 'certificate.p12'), ('IOS_PROVISION_PROFILE_BASE64', 'profile.mobileprovision')]:
              try:
                  data = base64.b64decode(''.join(os.environ[name].split()), validate=True)
                  if not data:
                      raise ValueError()
              except Exception:
                  raise SystemExit('Invalid base64 file in secret: ' + name)
              (root / filename).write_bytes(data)
          print('Signing files decoded; secret contents are not logged.')
          PY
      - name: Import certificate and validate profile
        env:
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/manee-signing"
          keychain_path="$signing_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          # Windows OpenSSL 3 exports PBES2. Re-wrap locally for macOS import
          # only if the native importer cannot read the original container.
          if ! security import "$signing_dir/certificate.p12" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign > /dev/null 2>&1; then
            openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
            "$openssl_bin" pkcs12 -in "$signing_dir/certificate.p12" -passin env:P12_PASSWORD -noenc -out "$signing_dir/identity.pem"
            "$openssl_bin" pkcs12 -export -in "$signing_dir/identity.pem" -passout env:P12_PASSWORD -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -out "$signing_dir/compatible.p12"
            security import "$signing_dir/compatible.p12" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign > /dev/null
            rm -f "$signing_dir/identity.pem" "$signing_dir/compatible.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"
          python3 - <<'PY'
          import os, pathlib, plistlib, datetime, hashlib, subprocess, re, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'manee-signing'
          profile = plistlib.loads((root / 'profile.plist').read_bytes())
          team, bundle = 'J7AWFKW86N', 'kr.co.manee.app'
          ent = profile.get('Entitlements', {})
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          require(profile.get('TeamIdentifier') == [team], 'Profile is for a different Apple team.')
          require(ent.get('application-identifier') == team + '.' + bundle, 'Profile is for a different app.')
          require(ent.get('com.apple.developer.team-identifier') == team, 'Profile team entitlement mismatch.')
          require(ent.get('aps-environment') == 'production', 'Regenerate the App Store profile with Push Notifications enabled.')
          require(not ent.get('get-task-allow', True), 'A distribution profile is required.')
          require('ProvisionedDevices' not in profile and not profile.get('ProvisionsAllDevices'), 'An App Store profile is required.')
          require(profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Profile has expired.')
          uuid = profile['UUID']
          require(bool(re.fullmatch(r'[0-9A-Fa-f-]{36}', uuid)), 'Invalid profile UUID.')
          identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning', str(root / 'signing.keychain-db')], text=True)
          valid = re.findall(r'\b([0-9A-Fa-f]{40})\s+"Apple Distribution:', identities)
          allowed = {hashlib.sha1(cert).hexdigest().upper() for cert in profile.get('DeveloperCertificates', [])}
          matches = [fingerprint.upper() for fingerprint in valid if fingerprint.upper() in allowed]
          require(len(matches) == 1, 'No unique valid distribution identity matches this profile.')
          fingerprint = matches[0]
          # Xcode 16+ and earlier profile search locations.
          for relative in ('Library/Developer/Xcode/UserData/Provisioning Profiles', 'Library/MobileDevice/Provisioning Profiles'):
              dest = pathlib.Path.home() / relative
              dest.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / 'profile.mobileprovision', dest / (uuid + '.mobileprovision'))
          (root / 'uuid.txt').write_text(uuid)
          options = {'method': 'app-store-connect', 'destination': 'export', 'teamID': team,
                     'signingStyle': 'manual', 'signingCertificate': fingerprint,
                     'provisioningProfiles': {bundle: uuid}, 'manageAppVersionAndBuildNumber': False}
          (root / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          # Apply manual signing only to the app Release configuration, not SPM targets.
          project = pathlib.Path('ios/App/App.xcodeproj/project.pbxproj')
          content = project.read_text()
          pattern = r'(\t\t504EC3181FED79650016851F /\* Release \*/ = \{.*?\n\t\t\};)'
          def configure(match):
              block = match[0]
              require('CODE_SIGN_STYLE = Automatic;' in block, 'Unexpected app signing configuration.')
              return block.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "' + fingerprint + '";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + uuid + '";')
          content, count = re.subn(pattern, configure, content, flags=re.S)
          require(count == 1, 'Could not locate the app Release configuration.')
          project.write_text(content)
          print('Certificate password, signing identity, profile, team and bundle ID verified.')
          PY
      - run: npm ci
      - run: npm test
      - name: Prepare selected native environment
        run: |
          node scripts/build-release152.mjs ios production
          node scripts/verify-store-assets.mjs --release152
      - run: npm run sync:ios
      - name: Archive signed iPhone app
        run: |
          set -euo pipefail
          build_number="152.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/manee.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/manee-derived" \
            CURRENT_PROJECT_VERSION="$build_number" MARKETING_VERSION=1.52 \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/manee-signing/signing.keychain-db" \
            archive > "$RUNNER_TEMP/manee-archive.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/manee-archive.log"; exit 1; }
      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/manee.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/manee-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/manee-ipa" > "$RUNNER_TEMP/manee-export.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/manee-export.log"; exit 1; }
          test -n "$(find "$RUNNER_TEMP/manee-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          codesign --verify --deep --strict "$RUNNER_TEMP/manee.xcarchive/Products/Applications/App.app"
          echo 'Signed IPA exported. No App Store upload or review submission was performed.'
          echo '### Signed archive verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Signing succeeded; the IPA is an artifact only. Production backend service parity and store offer configuration remain external release gates.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: manee-ios-1.52-store-update
          path: ${{ runner.temp }}/manee-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect for TestFlight
        env:
          MANEE_UPLOAD_TESTFLIGHT: 'true'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/manee-ipa/"*.ipa)
          test "${#ipas[@]}" -eq 1
          node scripts/upload-testflight.mjs "${ipas[0]}"
          echo 'Upload accepted; Apple processing is pending. No review submission or tester invitation was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Apple processing and connect the existing internal QA group
        env:
          MANEE_INTERNAL_BUILD: 'ios-20261106-1.52'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/connect-testflight152.mjs | tee "$RUNNER_TEMP/manee152-testflight-status.json"
          cat "$RUNNER_TEMP/manee152-testflight-status.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manee-ios-1.52-testflight-status
          path: ${{ runner.temp }}/manee152-testflight-status.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing materials
        if: always()
        run: |
          signing_dir="$RUNNER_TEMP/manee-signing"
          security delete-keychain "$signing_dir/signing.keychain-db" 2>/dev/null || true
          if [ -f "$signing_dir/uuid.txt" ]; then
            profile_uuid="$(cat "$signing_dir/uuid.txt")"
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
          fi
          rm -rf "$signing_dir"
          rm -rf "$RUNNER_TEMP"/manee-upload-*
